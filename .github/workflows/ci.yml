name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  web:
    name: Engine, WASM, unit and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: .tools/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('.emscripten-version') }}

      - name: Install the pinned Emscripten
        run: ./scripts/setup-emsdk.sh

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the native engine and run CTest
        run: pnpm build:engine

      - name: Build and test the engine with Clang
        run: |
          cmake -S engine -B build/clang -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
          cmake --build build/clang
          ctest --test-dir build/clang --output-on-failure

      - name: Engine tests under AddressSanitizer and UBSan
        run: |
          cmake -S engine -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build/asan
          ctest --test-dir build/asan --output-on-failure

      - name: Build the WebAssembly engine
        run: pnpm build:wasm

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (Vitest, against the WASM build)
        run: pnpm test:unit

      - name: Production build and build check
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests (Playwright, against the production build)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
