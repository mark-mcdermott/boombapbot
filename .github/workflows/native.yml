name: Native apps

# The desktop app, the phone engine plug-in and the VST3 instrument. macOS
# minutes cost about ten times Linux ones, so this runs only when something
# these builds use changes.
on:
  push:
    branches: [main]
    paths: &native-paths
      - engine/**
      - packages/machine-*/engine/**
      - packages/machine-*/data/**
      - packages/machine-*/fixtures/**
      - apps/desktop/**
      - apps/mobile/native-engine/**
      - apps/mobile/native-store/**
      - plugins/vst3/**
      - packages/contracts/src/license-file.ts
      - docs/license-file.md
      - scripts/build-engine-ios.sh
      - scripts/build-wasm.sh
      - scripts/setup-emsdk.sh
      - .emscripten-version
      - pnpm-lock.yaml
      - .github/workflows/native.yml
  pull_request:
    paths: *native-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm:
    name: WebAssembly engine for the desktop page
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@v3.31.6
        with:
          cmakeVersion: 3.31.6

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: .tools/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('.emscripten-version') }}

      - name: Install the pinned Emscripten
        run: ./scripts/setup-emsdk.sh

      - name: Build the WebAssembly engine
        run: ./scripts/build-wasm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-engine
          path: build/wasm/boombapbot-engine-*.wasm
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Desktop app on ${{ matrix.name }}
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-26
            packages: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            packages: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The runner's own CMake: 3.31 does not know Windows' Visual Studio 2026 generator.
      - name: CMake
        run: cmake --version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: actions/download-artifact@v4
        with:
          name: wasm-engine
          path: build/wasm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare the engine and the panel art
        run: pnpm prepare:assets

      - name: Build the app
        run: pnpm --filter @boombapbot/desktop bundle

      - name: Rust tests
        run: pnpm --filter @boombapbot/desktop test:engine

      # Unsigned, for trying on a machine of that kind: the .dmg on macOS, the installer on Windows.
      - uses: actions/upload-artifact@v4
        with:
          name: boombapbot-desktop-${{ matrix.name }}
          path: ${{ matrix.packages }}
          if-no-files-found: error
          retention-days: 7

  vst3:
    name: VST3 instrument on macOS
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: CMake and Ninja
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          cmake --version

      # The plugin's window is a page, which the build makes with pnpm from
      # the same panel the site shows.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # JUCE is fetched here and never vendored, and so are Monocypher, which
      # checks the license file's signature, and Steinberg's VST3 SDK, for
      # its validator. The build is universal, so each file compiles twice.
      - name: Configure
        run: >
          cmake -S plugins/vst3 -B build/vst3 -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBOOMBAPBOT_VST3_STEINBERG_VALIDATOR=ON

      - name: Build
        run: cmake --build build/vst3

      # The processor self-test, the window opened with its page in it, then
      # the bundle: its signature, its two architectures, and each of them
      # loaded and played in JUCE's own VST3 host and put through Steinberg's
      # validator. No DAW runs here, and the
      # bundle is not kept: a build that is handed on needs a notices file
      # with the licences of what it carries, and there is none yet.
      - name: Self-test and bundle checks
        run: ctest --test-dir build/vst3 --output-on-failure

  ios:
    name: Phone engine plug-in on iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@v3.31.6
        with:
          cmakeVersion: 3.31.6

      - name: Build the engine as an XCFramework
        run: ./scripts/build-engine-ios.sh ritm12 apps/mobile/native-engine/ios/BoombapbotEngine.xcframework

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('apps/mobile/native-engine/Package.swift') }}

      - name: The plug-in's tests in a simulator
        working-directory: apps/mobile/native-engine
        run: |
          simulator="$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')"
          xcodebuild test \
            -scheme BoombapbotNativeEngine \
            -destination "id=$simulator" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/build/spm"

      # It has no tests of its own to run here: buying needs a store. That it compiles is what CI can say.
      - name: The store plug-in builds
        working-directory: apps/mobile/native-store
        run: |
          xcodebuild build \
            -scheme BoombapbotNativeStore \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/build/spm" \
            CODE_SIGNING_ALLOWED=NO

  android:
    name: Phone engine plug-in on Android
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the NDK and CMake build.gradle pins
        run: |
          ndk="$(sed -nE 's/.*ndkVersion = "([^"]+)".*/\1/p' apps/mobile/native-engine/android/build.gradle)"
          cmake="$(sed -nE 's/.*version "([0-9.]+)".*/\1/p' apps/mobile/native-engine/android/build.gradle)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" "cmake;$cmake"

      - uses: actions/download-artifact@v4
        with:
          name: wasm-engine
          path: build/wasm

      # Capacitor writes the plug-in projects Gradle includes only beside a built page,
      # and the app's page carries the site's pages of words, lifted from the built site.
      - name: Build the page and sync it into the Android project
        run: |
          pnpm build
          pnpm --filter @boombapbot/mobile build
          pnpm --filter @boombapbot/mobile exec cap sync android

      - name: Build the plug-in and its tests
        working-directory: apps/mobile/android
        run: ./gradlew :boombapbot-native-engine:assembleDebug :boombapbot-native-engine:assembleDebugAndroidTest

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The plug-in's instrumented tests in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: apps/mobile/android
          script: ./gradlew :boombapbot-native-engine:connectedDebugAndroidTest
